# Alembic configuration.
# The database URL is intentionally absent: migrations/env.py reads DATABASE_URL
# from the environment so no credential ever lands in a tracked file.

[alembic]
# Migrations live inside the package so they ship with the code that needs
# them - one directory to copy, one thing that can go missing instead of two.
script_location = app/migrations
prepend_sys_path = .
version_path_separator = os
timezone = UTC
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
