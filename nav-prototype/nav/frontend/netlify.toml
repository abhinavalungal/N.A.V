# Netlify configuration for the N.A.V. frontend.
#
# The app is a static export (next.config.mjs sets output: "export"), so there
# is no Next.js runtime and no plugin: Netlify just publishes the out/ folder.
#
# Set the site's base directory to "frontend", then add
#   NEXT_PUBLIC_API_URL = https://your-backend/api/v1
# under Site settings -> Environment variables. Without it the build falls back
# to .env.production, which assumes the API is on the same origin.
# NEXT_PUBLIC_* values are compiled into the bundle, so changing one needs a
# fresh deploy, not just a restart.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed build assets and the offline chart basemap never change in place.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/land.geojson"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
