# Render Blueprint for N.A.V. (prototype).
#
# The API builds from ./Dockerfile at the repository root, which is what Render
# looks for by default - so a service created by hand works without touching
# any path setting. Only the console needs its Dockerfile named.
#
# Three resources, all on free plans: API, console, Postgres. No secret to
# generate, no cache, no worker - nothing in the prototype needs them.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.

services:
  # --- API ------------------------------------------------------------------
  - type: web
    name: nav-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
        - Dockerfile
        - render.yaml
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Render injects PORT; the image's CMD reads it.
      # Supplied as postgresql://; Settings rewrites it for asyncpg.
      - key: DATABASE_URL
        fromDatabase:
          name: nav-postgres
          property: connectionString
      # REDIS_URL is deliberately unset: readiness reports redis as
      # NOT_CONFIGURED, which does not block the service.
      - key: LLM_PROVIDER
        value: mock
      - key: WEATHER_PROVIDER
        value: mock
      - key: ROUTING_PROVIDER
        value: mock

  # --- Console --------------------------------------------------------------
  - type: web
    name: nav-web
    runtime: docker
    plan: free
    region: singapore
    # Context is the repository root: the build needs the npm workspace.
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      # The only value you supply. Render cannot compose a URL from another
      # service's hostname, so paste the API's URL after the first deploy:
      # https://nav-api.onrender.com
      - key: API_INTERNAL_URL
        sync: false

  # --- Cache / broker -------------------------------------------------------
  # Not needed until Phase 4 queues optimisation runs. Uncomment then, and add
  # REDIS_URL to nav-api. Note that Render has no free plan for background
  # workers, so the Celery service is a paid instance when it arrives.
  #
  # - type: keyvalue
  #   name: nav-keyvalue
  #   plan: free
  #   region: singapore
  #   maxmemoryPolicy: noeviction
  #   ipAllowList: []          # private network only

databases:
  - name: nav-postgres
    plan: free
    region: singapore
    databaseName: nav
    postgresMajorVersion: "16"
